# Runs on every pull request and push to main/dev: backend end-to-end tests against a real
# PocketBase, front-end lint/typecheck/build, the deploy-script tests, and the Base44 importer.
name: CI
on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PB_VERSION: "0.36.0"
      PB_SU_EMAIL: ci@test.local
      PB_SU_PASS: ci-test-pass-1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install PocketBase
        run: |
          curl -fsSL -o pb.zip "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip"
          unzip -q pb.zip pocketbase
      - name: Start mock services and PocketBase
        run: |
          node backend/test/mock-services.mjs 9100 &
          ./pocketbase superuser upsert "$PB_SU_EMAIL" "$PB_SU_PASS" --dir ./ci-data --migrationsDir backend/pb_migrations
          NCO_PIN=test-pin-1234 ANTHROPIC_API_KEY=a ANTHROPIC_API_URL=http://127.0.0.1:9100/anthropic \
          SLACK_BOT_TOKEN=xoxb-test SLACK_SIGNING_SECRET=test-signing-secret SLACK_API_URL=http://127.0.0.1:9100/slack \
          WORDPRESS_APP_PASSWORD=wp APP_URL=http://127.0.0.1:8090 RATE_LIMIT_DEFAULTS=off \
          PIN_RATE_LIMIT=10 PUBLIC_RATE_LIMIT=1000 TZ=America/Phoenix \
          ./pocketbase serve --dir ./ci-data --migrationsDir backend/pb_migrations --hooksDir backend/pb_hooks --http 127.0.0.1:8090 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8090/api/health >/dev/null && break; sleep 1; done
      - run: node --test backend/test/api.test.mjs

  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for f in deploy/*.sh deploy/test/*.sh; do bash -n "$f"; done
      - run: bash deploy/test/install.test.sh

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  importer:
    runs-on: ubuntu-latest
    env:
      PB_VERSION: "0.36.0"
      PB_URL: http://127.0.0.1:8091
      PB_SUPERUSER_EMAIL: ci@test.local
      PB_SUPERUSER_PASSWORD: ci-test-pass-1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --test scripts/import-base44.test.mjs scripts/find-orphans.test.mjs
      - run: node scripts/import-base44.mjs example-data --dry-run
      - name: Import the example data into a fresh PocketBase and check it
        run: |
          curl -fsSL -o pb.zip "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip"
          unzip -q pb.zip pocketbase
          ./pocketbase superuser upsert "$PB_SUPERUSER_EMAIL" "$PB_SUPERUSER_PASSWORD" --dir ./imp-data --migrationsDir backend/pb_migrations
          NCO_PIN=ci-pin-123456 ./pocketbase serve --dir ./imp-data --migrationsDir backend/pb_migrations --hooksDir backend/pb_hooks --http 127.0.0.1:8091 &
          for i in $(seq 1 30); do curl -fsS "$PB_URL/api/health" >/dev/null && break; sleep 1; done
          node scripts/import-base44.mjs example-data
          node scripts/verify-import.mjs 3 120 12 174 2
          node scripts/find-orphans.mjs
