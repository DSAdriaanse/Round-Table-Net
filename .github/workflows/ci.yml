# Runs on every pull request and push to main/dev. Jobs are added here as the
# pieces arrive: the backend end-to-end tests now; the front end and deploy-script
# checks in later pull requests.
name: CI
on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PB_VERSION: "0.36.0"
      PB_SU_EMAIL: ci@test.local
      PB_SU_PASS: ci-test-pass-1234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install PocketBase
        run: |
          curl -fsSL -o pb.zip "https://github.com/pocketbase/pocketbase/releases/download/v${PB_VERSION}/pocketbase_${PB_VERSION}_linux_amd64.zip"
          unzip -q pb.zip pocketbase
      - name: Start mock services and PocketBase
        run: |
          node backend/test/mock-services.mjs 9100 &
          ./pocketbase superuser upsert "$PB_SU_EMAIL" "$PB_SU_PASS" --dir ./ci-data --migrationsDir backend/pb_migrations
          NCO_PIN=test-pin-1234 ANTHROPIC_API_KEY=a ANTHROPIC_API_URL=http://127.0.0.1:9100/anthropic \
          WORDPRESS_APP_PASSWORD=wp APP_URL=http://127.0.0.1:8090 RATE_LIMIT_DEFAULTS=off \
          PIN_RATE_LIMIT=10 PUBLIC_RATE_LIMIT=1000 TZ=America/Phoenix \
          ./pocketbase serve --dir ./ci-data --migrationsDir backend/pb_migrations --hooksDir backend/pb_hooks --http 127.0.0.1:8090 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8090/api/health >/dev/null && break; sleep 1; done
      - run: node --test backend/test/api.test.mjs
