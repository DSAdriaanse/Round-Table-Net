# Installed by deploy/server.sh (__DOMAIN__ and __BACKEND__ are filled in).
# __BACKEND__ is 127.0.0.1:<port> when Nginx runs on the app server, or <app server address>:<port> when this
# file is used on an external reverse proxy (server.sh prints it ready to paste in that mode).
# HTTP only on purpose: certbot adds the TLS server block and the HTTP->HTTPS redirect.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # PocketBase admin UI (/_/): uncomment to limit it to your own network.
    # location /_/ { allow 203.0.113.0/24; deny all; proxy_pass http://__BACKEND__; }

    # Realtime (SSE): no buffering and a long read timeout, or live updates stall.
    location /api/realtime {
        proxy_pass http://__BACKEND__;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3h;
    }

    location / {
        proxy_pass http://__BACKEND__;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
